# Initial certificate issuance only: no application routes are exposed over HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name afterlife.abenezer-ayalneh.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
