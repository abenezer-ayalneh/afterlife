# Install this final configuration AFTER Certbot issues the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name afterlife.abenezer-ayalneh.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://afterlife.abenezer-ayalneh.dev$request_uri; }
}

# Install as a NEW site; inspect nginx -T before enabling.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name afterlife.abenezer-ayalneh.dev;
    ssl_certificate /etc/letsencrypt/live/afterlife.abenezer-ayalneh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afterlife.abenezer-ayalneh.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host != afterlife.abenezer-ayalneh.dev) { return 403; }
    client_max_body_size 16k;
    access_log /home/richard/afterlife/.logs/nginx-access.log combined;
    error_log /home/richard/afterlife/.logs/nginx-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host afterlife.abenezer-ayalneh.dev;
        proxy_set_header X-Forwarded-Host afterlife.abenezer-ayalneh.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
